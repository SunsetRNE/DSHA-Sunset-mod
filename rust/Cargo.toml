[workspace]
members = ["crates/dsha-core"]
resolver = "2"

# R0 冻结首期依赖集与 vendor 字节；R1 已真实使用 sha2/sha1（flate2 仍留给 R3 gzip）。
# Cargo 1.100 的 manifest lint 会把“已声明未使用”当警告；flate2 在 R3 前仍未被调用，
# 因此暂时保留 allow 并记录理由，而不是删掉依赖让 Cargo.lock/vendor 与冻结清单漂移。
# R3 接入 archive_pack/unpack 后应移除本 allow，让未使用依赖重新成为硬告警。
[workspace.lints.cargo]
unused_dependencies = "allow"

[workspace.package]
edition = "2021"
rust-version = "1.100.0"
license = "MIT"
publish = false

# R0 锁定（ADR-0004 决定四 / 方案 §0.2.3）：Android 上 abort 会杀整个 App 进程，
# 因此 dev 与 release 都禁止 panic=abort；release 以体积为目标，不承诺性能倍数。
[profile.dev]
panic = "unwind"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "unwind"          # 禁止 abort：Android 上 abort 会杀整个 App 进程
strip = "symbols"
