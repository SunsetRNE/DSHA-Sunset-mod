name: "Node: Standard unit tests"

# 可复用节点：layout 声明的所有 JVM 单测。full 使用固定输入、新鲜任务/报告及冻结基线。
# filtered/source-only 单独汇总，不产生全仓 full PASS 或改写基线。
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check out (defaults to the caller's commit)
        required: false
        type: string
        default: ''
      mode:
        description: full or source-only
        required: true
        type: string
      handoff:
        description: Input handoff artifact from _node-inputs.yml
        required: true
        type: string
      require_fixtures:
        description: Require the seven external-fixture tests to run once and pass (full, unfiltered only)
        required: false
        type: boolean
        default: false
      sunset_test:
        description: Pass -Pdsha.sunsetTest=true
        required: false
        type: boolean
        default: true
      tests:
        description: Optional space-separated Gradle --tests patterns (full runs become filtered)
        required: false
        type: string
        default: ''
      rerun:
        description: Pass --rerun-tasks
        required: false
        type: boolean
        default: false
      forks:
        description: Test JVM forks (full requires 1; filtered/source-only allow 1-4)
        required: false
        type: number
        default: 1
      rust_host:
        description: Build the host Rust .so and pass -Pdsha.rust.hostLib (full runs need 0 skipped)
        required: false
        type: boolean
        default: false
      artifact:
        description: Name of the uploaded JUnit/receipt artifact
        required: false
        type: string
        default: unit-results
    outputs:
      artifact:
        description: Uploaded JUnit/receipt artifact name
        value: ${{ inputs.artifact }}
permissions:
  contents: read
jobs:
  unit:
    name: Standard unit tests (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      # R1：full 单测要求 0 skipped，RustDigestDifferentialTest 需要主机目标 .so。
      # rust_host=true 时用锁定工具链构建主机 .so 并把路径传给测试 JVM；source-only 不构建。
      - name: Restore pinned Rust toolchain cache (host differential)
        if: inputs.rust_host
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup
          key: rustup-1.100.0-${{ runner.os }}-${{ hashFiles('ci/rust-toolchain.lock.json') }}
      - name: Install pinned Rust toolchain (host differential)
        if: inputs.rust_host
        run: |
          set -eu
          channel=$(python3 -c "import json;print(json.load(open('ci/rust-toolchain.lock.json'))['channel'])")
          rustup toolchain install "$channel" --profile minimal
      - name: Build host Rust .so for differential tests
        if: inputs.rust_host
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          set -eu
          python3 tools/rust/build.py --host --expect-lock \
            --out out/rust-host --receipt out/rust-host/receipt.json
      - uses: ./.github/actions/android-sdk
        with:
          ndk: ${{ inputs.mode == 'full' }}
      - uses: ./.github/actions/restore-handoff
        with:
          artifact: ${{ inputs.handoff }}
          fixture: 'true'
      # Robolectric 默认在单测中途临时下载 android-all，runner 网络抖动会让整批 sdk=N 测试类
      # 以 MavenArtifactFetcher IOException 失败（build273、build277）。改为测试前按锁文件准备、
      # 逐个核对 sha256（缓存命中也重新核对），单测走 robolectric.offline。
      - name: Restore Robolectric android-all cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/robolectric-deps
          key: robolectric-android-all-${{ hashFiles('tools/robolectric-sdk.lock.json') }}
      - name: Prepare pinned Robolectric android-all jars
        run: python3 tools/prepare-robolectric-sdks.py --dir "$RUNNER_TEMP/robolectric-deps"
      - name: Enumerate expected unit tasks from source layout
        env:
          MODE: ${{ inputs.mode }}
          TESTS: ${{ inputs.tests }}
          REQUIRE_FIXTURES: ${{ inputs.require_fixtures }}
          RUST_HOST: ${{ inputs.rust_host }}
          FORKS: ${{ inputs.forks }}
        run: |
          set -euf
          case "$MODE" in full|source-only) ;; *) echo "unknown mode: $MODE"; exit 2 ;; esac
          if [ "$REQUIRE_FIXTURES" = true ] && { [ "$MODE" != full ] || [ -n "$TESTS" ]; }; then
            echo "require_fixtures needs a full, unfiltered run"; exit 2
          fi
          if [ "$MODE" = full ] && [ -z "$TESTS" ]; then
            if [ "$RUST_HOST" != true ]; then
              echo "full contract requires the host Rust library and receipt"; exit 2
            fi
            if [ "$FORKS" != 1 ]; then
              echo "full contract requires the default single test fork"; exit 2
            fi
          fi
          python3 tools/source_layout.py --test-tasks --output out/unit-layout-tasks.json
          python3 tools/unit_test_contract.py plan --root "$PWD" --output out/unit-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          tasks = json.loads(Path('out/unit-layout-tasks.json').read_text(encoding='utf-8'))
          if not tasks:
              raise SystemExit('UNIT_LAYOUT_TASKS_EMPTY')
          Path('out/unit-tasks.txt').write_text(''.join(row['task'] + '\n' for row in tasks), encoding='utf-8')
          Path('out/unit-report-dirs.txt').write_text(''.join(row['reports'] + '\n' for row in tasks), encoding='utf-8')
          PY
      - name: Run layout unit tests
        env:
          DSHA_ROBOLECTRIC_DEPENDENCY_DIR: ${{ runner.temp }}/robolectric-deps
          MODE: ${{ inputs.mode }}
          TESTS: ${{ inputs.tests }}
          RERUN: ${{ inputs.rerun }}
          SUNSET_TEST: ${{ inputs.sunset_test }}
          FORKS: ${{ inputs.forks }}
          RUST_HOST: ${{ inputs.rust_host }}
        run: |
          set -euf
          mapfile -t unit_tasks < out/unit-tasks.txt
          if [ "${#unit_tasks[@]}" -eq 0 ]; then echo "layout has no unit tasks"; exit 2; fi
          # 多模块也串行调度 Test，避免每模块单 fork 累积成并行大堆 JVM。
          args=(--no-daemon --max-workers=2 --no-parallel)
          if [ "$MODE" = full ] && [ -z "$TESTS" ]; then
            args+=(verifyDshaBuildConventions)
          fi
          for task in "${unit_tasks[@]}"; do
            args+=("$task")
            for pattern in $TESTS; do
              case "$pattern" in *[!A-Za-z0-9_.*\$-]*) echo "unsafe --tests pattern"; exit 2 ;; esac
              args+=(--tests "$pattern")
            done
          done
          case "$MODE" in
            full) args+=(-Pdsha.sourceOnlyTests=false) ;;
            source-only) args+=(-Pdsha.sourceOnlyTests=true -x :app:prepareStandardAssets -x :app:prepareRecoveryAssets) ;;
            *) echo "unknown mode: $MODE"; exit 2 ;;
          esac
          if [ "$SUNSET_TEST" = true ]; then args+=(-Pdsha.sunsetTest=true); fi
          if [ "$RUST_HOST" = true ]; then
            args+=("-Pdsha.rust.hostLib=$PWD/out/rust-host/libdsha_rs.so")
            args+=(-Pdsha.rust.required=true)
          fi
          if [ "$MODE" = full ] && [ -z "$TESTS" ]; then
            export DSHA_UNIT_TEST_STATE="$PWD/out/unit-run"
            python3 tools/unit_test_contract.py begin --root "$PWD" --plan out/unit-plan.json \
              --state "$DSHA_UNIT_TEST_STATE" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --rust-library out/rust-host/libdsha_rs.so --rust-receipt out/rust-host/receipt.json
            # full 必须实际执行每个 Test；UP-TO-DATE/NO-SOURCE 没有成功凭据。
            args+=(--rerun-tasks)
          elif [ "$RERUN" = true ]; then
            args+=(--rerun-tasks)
          fi
          case "$FORKS" in 1|2|3|4) ;; *) echo "forks must be 1-4"; exit 2 ;; esac
          if [ "$FORKS" != 1 ]; then
            # 与 tools/verify-stability.py --test-forks 相同：init 脚本放在仓库外，只改 fork 数。
            init="$RUNNER_TEMP/dsha-test-forks.init.gradle"
            printf '%s\n' "gradle.projectsEvaluated { rootProject.allprojects { p -> p.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach { t -> t.maxParallelForks = $FORKS } } }" > "$init"
            args+=(--init-script "$init")
          fi
          chmod +x gradlew
          ./gradlew "${args[@]}"
      - name: Verify complete fresh unit-test contract
        if: ${{ always() && inputs.mode == 'full' && inputs.tests == '' }}
        run: |
          set -euf
          python3 tools/unit_test_contract.py verify --root "$PWD" --state out/unit-run \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --baseline ci/unit-test-baseline.json --output out/unit-tests.json
      - name: Summarize filtered or source-only tests separately
        if: ${{ always() && (inputs.mode != 'full' || inputs.tests != '') }}
        env:
          MODE: ${{ inputs.mode }}
          TESTS: ${{ inputs.tests }}
        run: |
          set -euf
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          tasks = json.loads(Path('out/unit-layout-tasks.json').read_text(encoding='utf-8'))
          summaries = Path('out/unit-summaries')
          summaries.mkdir(parents=True, exist_ok=True)
          rows = []
          # 旧验证器保留其计数、失败/跳过检查；每个 layout 报告目录均须存在。
          env = dict(os.environ, GITHUB_STEP_SUMMARY='')
          for index, row in enumerate(tasks):
              output = summaries / f'{index:03d}.json'
              subprocess.run([sys.executable, 'tools/verify-unit-results.py', '--mode', os.environ['MODE'],
                              '--reports', row['reports'], '--output', str(output)], env=env, check=True)
              rows.append(dict(row, summary=json.loads(output.read_text(encoding='utf-8'))))
          mode = 'filtered' if os.environ['TESTS'] else 'source-only'
          result = dict(mode=mode, completeFixedInputRun=False, modules=rows)
          Path('out/unit-tests.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write(f'### {mode} unit tests (not a complete fixed-input run)\n')
              for row in rows:
                  stream.write(f"- {row['task']}: {json.dumps(row['summary']['flavors']['Standard'])}\n")
          PY
      - name: Annotate failing unit tests across layout modules
        if: failure()
        run: |
          set -euf
          if [ -f out/unit-report-dirs.txt ]; then
            while IFS= read -r reports; do
              python3 tools/annotate-junit-failures.py "$reports"
            done < out/unit-report-dirs.txt
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ inputs.artifact }}
          path: |
            **/build/test-results/**
            out/unit-tests.json
            out/unit-summaries
            out/unit-plan.json
            out/unit-layout-tasks.json
            out/unit-tasks.txt
            out/unit-report-dirs.txt
            out/unit-run
            ci/unit-test-baseline.json
          if-no-files-found: error
          retention-days: 14
