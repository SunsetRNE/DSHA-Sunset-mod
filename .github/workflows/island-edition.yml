name: Island edition debug APK

# push 到 island-edition 或手动触发：产出带独立包名（.island）的调试 APK。
# 正式交付仍走 ci-package / 发布流程；本工作流不签名、不发布正式版本。
# 调试包先尝试 artifact；artifact 配额不可用时仍会作为 draft Release 附件保留。
on:
  push:
    branches: [island-edition]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore fixed build inputs from the release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/inputs
          gh release download v0.2.1-rc.3-20261027.1312 \
            --repo "${{ github.repository }}" \
            --pattern '*source.zip' --dir /tmp/inputs
          sha256sum /tmp/inputs/*source.zip
          unzip -q -o /tmp/inputs/*source.zip -d .
          # 归档里也含发布时源码；恢复本分支的受跟踪文件，只保留未被跟踪的固定输入。
          git checkout -f -- .
          test -s app/src/main/assets/offline-rootfs.bin
          test -s app/src/main/assets/dsh-runtime.bin
          echo "inputs restored"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "build-tools;36.0.0"
          "$SDKMANAGER" "platforms;android-37.0" || "$SDKMANAGER" "platforms;android-37"
          "$SDKMANAGER" --list_installed | sed -n '1,20p'

      - name: Build island edition debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug -Pdsha.islandEdition=true \
            --no-daemon --console=plain

      - name: Report APK identity
        if: always()
        run: |
          APK=$(ls -1 app/build/outputs/apk/standard/debug/*.apk 2>/dev/null | head -1 || true)
          if [ -n "$APK" ]; then
            ls -l "$APK"
            sha256sum "$APK"
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" \
              | grep -E 'package:|application-label:' | head -5
          else
            echo "no apk produced"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # artifact 存储是账号级配额；配额满时不能让构建本身算失败。
        continue-on-error: true
        if: always()
        with:
          name: dsha-island-debug
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: warn

      - name: Attach APK to a draft release
        # Release 资产不占 artifact 配额，作为唯一稳定的下载通道。
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(ls -1 app/build/outputs/apk/standard/debug/*.apk 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            echo "no apk produced; skip draft release"
            exit 0
          fi
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAG="island-debug-$SHORT"
          ASSET="dsha-island-debug-$SHORT.apk"
          cp "$APK" "$ASSET"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$ASSET" --draft \
              --title "上岛版调试包 $SHORT" \
              --target "$GITHUB_SHA" \
              --repo "${{ github.repository }}" \
              --notes "任务状态修复调试包（draft）。提交 $GITHUB_SHA，工作流 run $GITHUB_RUN_ID。仅用于真机验证，不代表正式发布。"
          fi
          URL=$(gh release view "$TAG" --repo "${{ github.repository }}" --json url -q .url)
          echo "draft release: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "draft release: $URL"
