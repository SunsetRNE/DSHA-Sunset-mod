          fi
          python3 tools/check-rust-native-apk.py --mode "$RUST_NATIVE_MODE" --apk "${candidates[0]}" \
            "${receipt_args[@]}" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --repository "$GITHUB_REPOSITORY" \
            --output out/rust-native-apk-pre-sign.json
