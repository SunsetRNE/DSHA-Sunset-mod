                   'commit': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'],
                   'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'repository': os.environ['GITHUB_REPOSITORY'],
                   'packageName': package.group(1), 'targetPackage': target, 'runner': runner,
                   'apkFile': apk.name, 'apkSize': apk.stat().st_size,
                   'apkSha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
                   'certificateSha256': os.environ['TARGET_CERT'], 'certificateMatchesTarget': True,
                   'execution': 'NOT_RUN', 'androidNativeLoadVerified': False,
                   'command': shlex.join(command),
                   'note': 'debug 设备加载候选；尚未安装或执行，必须在授权设备上运行后才能证明 Android JNI 加载'}
          Path('out/rust-instrumentation-candidate.json').write_text(
              json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('out/rust-instrumentation-run.txt').write_text(
              '# NOT EXECUTED: 先经用户授权安装本次 debug 目标 APK 与同证书 instrumentation APK\n'
              + shlex.join(command) + '\n', encoding='utf-8')
          print(json.dumps(value, ensure_ascii=False, indent=2))
          PYCODE
            printf 'instrumentation_apk=%s\n' "$instrumentation_apk" >> "$GITHUB_OUTPUT"
          fi
      - name: Remove test private key
