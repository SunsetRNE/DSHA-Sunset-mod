            out/build-info.json
            out/apk-signature.txt
            out/apk-badging.txt
            out/apk-runtime-verification.txt
            out/apk-recovery-verification.txt
            out/third-party-apk.json
            out/apk-managed-assets.txt
            out/rust-native-apk-*.json
            out/rust-native/rust-receipt.json
            ${{ steps.sign.outputs.instrumentation_apk }}
            out/rust-instrumentation-candidate.json
