          EVIDENCE_URL: ${{ steps.upload_evidence.outputs.artifact-url }}
          INSTRUMENTATION_URL: ${{ steps.upload_instrumentation.outputs.artifact-url }}
          PACKAGE: ${{ steps.sign.outputs.package }}
        run: |
          {
            echo "### $VARIANT 测试包（非正式发布、未安装）"
            echo
            echo "Commit \`$GITHUB_SHA\` · package \`$PACKAGE\` · 测试证书来源 \`$SIGNING_KEY_SOURCE\`"
            echo
            echo "[APK]($APK_URL) · [证书、固定输入与校验回执]($EVIDENCE_URL)"
            echo
            echo "Rust 模式 \`$RUST_NATIVE_MODE\`；unsigned / pre-sign / signed 三份门禁回执在证据中，off 显式证明未带 Rust 库。"
            if [ "$RUST_NATIVE_MODE" = prebuilt ] && [ "$VARIANT" = debug ]; then
              echo
              echo "[Rust instrumentation APK 候选]($INSTRUMENTATION_URL)（与目标 debug APK 同测试证书，尚未安装、尚未执行）"
              echo
              echo '本 debug 路径用于设备加载候选；构建、签名与静态检查不证明 Android JNI 已加载。授权安装两份候选后，可手动执行：'
