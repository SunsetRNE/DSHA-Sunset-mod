            "$apksigner" sign --ks "$TEST_KEY" --ks-key-alias sunset-test \
              --ks-pass env:TEST_STORE_PASSWORD --key-pass env:TEST_STORE_PASSWORD \
              --out "$instrumentation_apk" "$candidate_input"
            "$apksigner" verify --verbose --print-certs "$instrumentation_apk" > out/instrumentation-signature.txt
            "$aapt2" dump badging "$instrumentation_apk" > out/instrumentation-badging.txt
            "$aapt2" dump xmltree --file AndroidManifest.xml "$instrumentation_apk" > out/instrumentation-manifest.txt
            INSTRUMENTATION_APK="$instrumentation_apk" INSTRUMENTATION_INPUT="$candidate_input" \
              TARGET_PACKAGE="$package" TARGET_CERT="$cert" python3 - <<'PYCODE'
          import hashlib, json, os, re, shlex, zipfile
          from pathlib import Path
          apk = Path(os.environ['INSTRUMENTATION_APK'])
          badging = Path('out/instrumentation-badging.txt').read_text(encoding='utf-8')
          package = re.search(r"^package: name='([^']+)'", badging, re.M)
          manifest = Path('out/instrumentation-manifest.txt').read_text(encoding='utf-8')
          def instrumentation_identity(tree):
              stack, roots, probes = [], [], []
              namespace = 'http://schemas.android.com/apk/res/android:'
              for line in tree.splitlines():
                  element = re.fullmatch(r'(\s*)E: (\S+) \(line=\d+\)', line)
                  if element:
                      indent, name = len(element.group(1)), element.group(2)
                      while stack and stack[-1][0] >= indent:
                          stack.pop()
                      parent = stack[-1][1] if stack else None
                      row = (indent, name, parent, {})
                      if parent is None:
                          roots.append(name)
                      stack.append(row)
                      if name == 'instrumentation':
                          probes.append(row)
                      continue
                  attribute = re.fullmatch(r'(\s*)A: ([^=(]+)(?:\(0x[0-9a-fA-F]+\))?=(.*)', line)
                  if not attribute or not stack or stack[-1][1] != 'instrumentation':
                      continue
                  key = attribute.group(2)
                  if key not in (namespace + 'name', namespace + 'targetPackage'):
                      continue
                  value = re.fullmatch(r'"([^"\\]*)"(?: \(Raw: "([^"\\]*)"\))?', attribute.group(3))
                  if len(attribute.group(1)) <= stack[-1][0] or key in stack[-1][3] or not value \
                          or value.group(2) is not None and value.group(2) != value.group(1):
                      raise SystemExit('RUST_INSTRUMENTATION_XMLTREE')
                  stack[-1][3][key] = value.group(1)
              if roots != ['manifest'] or len(probes) != 1 or probes[0][2] != 'manifest':
                  raise SystemExit('RUST_INSTRUMENTATION_XMLTREE')
              attributes = probes[0][3]
              if set(attributes) != {namespace + 'name', namespace + 'targetPackage'}:
                  raise SystemExit('RUST_INSTRUMENTATION_XMLTREE')
              return attributes[namespace + 'name'], attributes[namespace + 'targetPackage']
          runner = 'com.deepseekharness.app.util.RustNativeInstrumentation'
          target = os.environ['TARGET_PACKAGE']
          if not package or package.group(1) != target + '.test' \
                  or instrumentation_identity(manifest) != (runner, target):
              raise SystemExit('SIGNED_RUST_INSTRUMENTATION_MANIFEST')
          certificates = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-f]+)$',
                                   Path('out/instrumentation-signature.txt').read_text(encoding='utf-8'), re.M)
          if certificates != [os.environ['TARGET_CERT']]:
              raise SystemExit('RUST_INSTRUMENTATION_CERTIFICATE_MISMATCH')
          def payload(path):
              with zipfile.ZipFile(path) as archive:
                  entries = [entry for entry in archive.infolist() if not entry.filename.startswith('META-INF/')]
                  if len(entries) != len({entry.filename for entry in entries}):
                      raise SystemExit('RUST_INSTRUMENTATION_DUPLICATE_PAYLOAD')
