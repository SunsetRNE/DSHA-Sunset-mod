              raise SystemExit('RUST_INSTRUMENTATION_SIGNED_PAYLOAD_CHANGED')
          command = ['adb', 'shell', 'am', 'instrument', '-w', '-r',
                     '-e', 'commit', os.environ['GITHUB_SHA'],
                     '-e', 'runId', os.environ['GITHUB_RUN_ID'],
                     '-e', 'runAttempt', os.environ['GITHUB_RUN_ATTEMPT'],
                     '-e', 'repository', os.environ['GITHUB_REPOSITORY'], package.group(1) + '/' + runner]
