name: "Node: Kotlin formatting"

# 可复用节点：完整 Kotlin 格式门禁（ktfmt，ADR-0004 决定一）；失败时列出需要格式化的文件。
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check out (defaults to the caller's commit)
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  kotlin-format:
    name: Verify complete Kotlin formatting gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      # ktfmt fat jar 约 71 MB；缓存只在本节点使用，读取后仍由 lock 的 size/sha256 复核。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/build/kotlin-format
          key: ktfmt-${{ hashFiles('tools/ktfmt.lock.json') }}
      - name: Verify complete Kotlin formatting gate
        run: |
          python3 - <<'PYCODE'
          import json, subprocess, sys
          from pathlib import Path
          result = subprocess.run(['python3', 'tools/format-kotlin-tree.py', '--check'])
          summary = Path('app/build/kotlin-format/tree-summary.json')
          if result.returncode and summary.is_file():
              for report in json.loads(summary.read_text())['reports']:
                  for row in json.loads((summary.parent / report).read_text())['files']:
                      if row['needsFormatting']:
                          print('NEEDS_FORMAT ' + row['file'], flush=True)
          sys.exit(result.returncode)
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: kotlin-format-reports
          path: app/build/kotlin-format
          if-no-files-found: warn
          retention-days: 7
