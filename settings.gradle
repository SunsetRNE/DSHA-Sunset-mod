// Kotlin 工具链（ADR-0004 决定一）：AGP 9.0+ 自带 built-in Kotlin，不再声明/应用
// org.jetbrains.kotlin.android（该插件与 AGP 9 新 DSL 不兼容，AGP 10 起连 opt-out 都会移除）。
// AGP 9.1.1 的运行时依赖固定 KGP 2.2.10；这里保存唯一版本事实，由根 build.gradle 的
// buildscript classpath 显式 pin，禁止改成动态版本或 -SNAPSHOT。Kotlin 编译任务、stdlib
// 依赖与 jvmTarget 默认值都由 AGP 提供，应用模块只做显式 jvmTarget=17 配置。
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.mozilla.org/maven2/'
            content { includeGroupByRegex 'org\\.mozilla.*' }
        }
    }
}
// 必须在 pluginManagement / dependencyResolutionManagement 之后；settings 先于工程脚本求值，
// 根 build.gradle 的 buildscript 读取同一个值。
gradle.ext.kotlinVersion = '2.2.10'
rootProject.name = "deepseekharness"
include ':app'
